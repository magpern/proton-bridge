name: Build and publish Bridge image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "bridge/**"
      - ".env.example"
      - ".github/workflows/bridge.yml"
  pull_request:
    branches: [main]
    paths:
      - "bridge/**"
      - ".env.example"
      - ".github/workflows/bridge.yml"
  workflow_dispatch:
    inputs:
      bridge_version:
        description: "Proton Bridge version to build (e.g. 3.24.2)"
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/proton-bridge

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ── Resolve Bridge version ────────────────────────────────────────────
      # Priority: workflow_dispatch input → .env.example → fail
      - name: Resolve Bridge version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.bridge_version }}" ]]; then
            # 1. Manual dispatch — explicit override
            VER="${{ github.event.inputs.bridge_version }}"
            SOURCE="workflow_dispatch"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            # 2. Git tag — format: v<bridge-version>-<wrapper-patch>
            #    e.g. v3.24.2-1  →  Bridge 3.24.2  (wrapper patch 1)
            #         v3.24.2-2  →  Bridge 3.24.2  (wrapper patch 2, bug fix)
            #         v3.25.0-1  →  Bridge 3.25.0
            #    Strip leading 'v' and drop the wrapper patch suffix.
            RAW="${{ github.ref_name }}"   # e.g. v3.24.2-1
            RAW="${RAW#v}"                 # → 3.24.2-1
            VER="${RAW%-*}"                # → 3.24.2  (drop -<patch>)
            SOURCE="git tag (${{ github.ref_name }}) → Bridge ${VER}"
          else
            # 3. Branch push — fall back to .env.example (useful for testing main)
            VER="$(grep -E '^BRIDGE_VERSION=' .env.example | cut -d= -f2 | tr -d '[:space:]')"
            SOURCE=".env.example"
          fi

          if [[ -z "$VER" ]]; then
            echo "::error::Could not determine Bridge version."
            exit 1
          fi

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "### Bridge version: \`$VER\` (source: $SOURCE)" >> "$GITHUB_STEP_SUMMARY"

      # ── Docker Buildx ────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── Registry login (skipped on PRs) ──────────────────────────────────
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Image tags & labels ───────────────────────────────────────────────
      # Produces:
      #   main branch push  → ghcr.io/owner/proton-bridge:latest
      #                       ghcr.io/owner/proton-bridge:main
      #   tag v3.24.2       → ghcr.io/owner/proton-bridge:3.24.2
      #                       ghcr.io/owner/proton-bridge:3.24
      #                       ghcr.io/owner/proton-bridge:latest
      #   PR                → ghcr.io/owner/proton-bridge:pr-42  (not pushed)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Proton Mail Bridge
            org.opencontainers.image.description=Headless Proton Mail Bridge daemon (Bridge ${{ steps.version.outputs.version }})
            org.opencontainers.image.vendor=Proton AG
            proton.bridge.version=${{ steps.version.outputs.version }}

      # ── Build (and push if not a PR) ─────────────────────────────────────
      # The Dockerfile downloads the official amd64 .deb from GitHub releases,
      # so the image is linux/amd64 only.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./bridge
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BRIDGE_VERSION=${{ steps.version.outputs.version }}
          # GitHub Actions cache — reuses unchanged layers across runs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Write job summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull command:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
